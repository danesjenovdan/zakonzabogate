server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # /kapica -> /kapica/ brez absolutnega naslova (za ingressom)
  absolute_redirect off;

  gzip on;

  location = /index.html {
    internal;
    add_header Cache-Control "no-cache" always;
  }

  # strani izkušenj naj se vedno osvežijo
  location ~ \.html$ {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
