apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-www
spec:
  redirectRegex:
    regex: ^https?://www.zakonzabogate.si/(.*)
    replacement: https://zakonzabogate.si/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zakonzabogate
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: |
      traefik-redirect-to-https@kubernetescrd,
      zakonzabogate-redirect-www@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - zakonzabogate.si
        - www.zakonzabogate.si
      secretName: zakonzabogate-tls
  rules:
    - host: zakonzabogate.si
      http: &http_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zakonzabogate
                port:
                  number: 80
    - host: www.zakonzabogate.si
      http: *http_paths
